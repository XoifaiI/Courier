[workspace]
resolver = "3"
members = ["courier", "crates/*"]
exclude = ["courier-fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
courier-compiler = { path = "crates/compiler" }
courier-editor = { path = "crates/editor" }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
