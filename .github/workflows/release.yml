# Builds the courier compiler for each platform and the VS Code extension when a v* tag is pushed,
# and attaches them to a draft GitHub release. Nothing goes public until the draft is published by
# hand. Asset names carry the platform as Rokit reads it, so `rokit add XoifaiI/courier` installs
# the right one once the release is public.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, binary: courier.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, binary: courier }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64, binary: courier }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64, binary: courier }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: compiler
        run: cargo build --release --locked -p courier --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist
          cp compiler/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cd dist
          7z a "../courier-${GITHUB_REF_NAME}-${{ matrix.platform }}.zip" "${{ matrix.binary }}" > /dev/null || zip "../courier-${GITHUB_REF_NAME}-${{ matrix.platform }}.zip" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: courier-${{ matrix.platform }}
          path: courier-*.zip

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        working-directory: editors/vscode
        run: |
          npm ci || npm install
          npx --yes @vscode/vsce@3.6.0 package --skip-license --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: courier-vscode
          path: editors/vscode/*.vsix

  draft:
    needs: [compiler, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Draft. Check the assets, write the notes, then publish."
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "$notes"

