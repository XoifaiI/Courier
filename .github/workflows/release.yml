name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compiler:
    needs: extension
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, binary: courier.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, binary: courier }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64, binary: courier }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64, binary: courier }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: courier-vscode
          path: editors/vscode
      - name: Build
        working-directory: compiler
        run: cargo build --release --locked -p courier --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          cp compiler/target/${{ matrix.target }}/release/${{ matrix.binary }} out/
          cd out
          7z a "../courier-${GITHUB_REF_NAME}-${{ matrix.platform }}.zip" "${{ matrix.binary }}" > /dev/null || zip "../courier-${GITHUB_REF_NAME}-${{ matrix.platform }}.zip" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v7
        with:
          name: courier-${{ matrix.platform }}
          path: courier-*.zip

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: courier-vscode
          path: editors/vscode/courier.vsix

  wally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the Wally package
        run: |
          mkdir -p dist/courier
          cp -r src LICENSE packaging/wally.toml packaging/default.project.json dist/courier/
          cd dist && zip -qr "../courier-wally-${GITHUB_REF_NAME}.zip" courier
      - uses: actions/upload-artifact@v7
        with:
          name: courier-wally
          path: courier-wally-*.zip

  draft:
    needs: [compiler, extension, wally]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Draft. Check the assets, write the notes, then publish."
